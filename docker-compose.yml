services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: arima_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  # ============================================================
  # Migration / DB init — запускается один раз и завершает работу
  # ============================================================
  migrate:
    build: .
    container_name: arima_migrate
    command: python scripts/setup_db.py
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  # ============================================================
  # FastAPI Application
  # ============================================================
  app:
    build: .
    container_name: arima_app
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - LLM_URL=${LLM_URL:-http://ollama:11434/api/chat}
      - LLM_MODEL=${LLM_MODEL:-llama3}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
      - STREAMLIT_URL=${STREAMLIT_URL:-https://${DOMAIN:-localhost}/dashboard/}
      - TZ=${TZ:-Europe/Moscow}
      # SOCKS5 proxy для исходящих запросов к LLM (обход geo-блокировок)
      - HTTPS_PROXY=${OUTBOUND_PROXY:-}
      - HTTP_PROXY=${OUTBOUND_PROXY:-}
      - ALL_PROXY=${OUTBOUND_PROXY:-}
      - NO_PROXY=postgres,dashboard,localhost,127.0.0.1
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Нужен для ручного запуска all_dfs_to_db.py / all_figi_to_db.py
      - INVEST_TOKEN=${INVEST_TOKEN}
      - SIGNAL_BUY_THRESHOLD=${SIGNAL_BUY_THRESHOLD:-0.2}
      - SIGNAL_SELL_THRESHOLD=${SIGNAL_SELL_THRESHOLD:--0.2}
      - SIGNAL_NEUTRAL_THRESHOLD=${SIGNAL_NEUTRAL_THRESHOLD:-0.05}
      - MODEL_DISABLE_MIN_SAMPLES=${MODEL_DISABLE_MIN_SAMPLES:-10}
      - MODEL_DISABLE_HIT_RATE=${MODEL_DISABLE_HIT_RATE:-40}
      - USE_PARTIAL_CANDLE=${USE_PARTIAL_CANDLE:-false}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
      - ./output:/app/output
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]

  # ============================================================
  # Nightly Scheduler — fetch + train + LLM + AI reports
  # ============================================================
  scheduler:
    build: .
    container_name: arima_scheduler
    command: >
      python scripts/scheduler.py
      --nightly --no-initial
      --nightly-hour ${NIGHTLY_HOUR:-2}
      --nightly-minute ${NIGHTLY_MINUTE:-0}
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - INVEST_TOKEN=${INVEST_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - LLM_URL=${LLM_URL:-http://ollama:11434/api/chat}
      - LLM_MODEL=${LLM_MODEL:-llama3}
      - NIGHTLY_FETCH_DAYS=${NIGHTLY_FETCH_DAYS:-7}
      - NIGHTLY_TRAIN_TIMEOUT=${NIGHTLY_TRAIN_TIMEOUT:-10800}
      - NIGHTLY_LLM_LOOKBACK_HOURS=${NIGHTLY_LLM_LOOKBACK_HOURS:-12}
      - NIGHTLY_EXCLUDE_MODELS=${NIGHTLY_EXCLUDE_MODELS:-lstm,tcn,rdpg_lstm}
      - TZ=${TZ:-Europe/Moscow}
      - LOG_TO_FILE=false
      # SOCKS5 proxy для исходящих запросов к LLM (обход geo-блокировок)
      - HTTPS_PROXY=${OUTBOUND_PROXY:-}
      - HTTP_PROXY=${OUTBOUND_PROXY:-}
      - ALL_PROXY=${OUTBOUND_PROXY:-}
      - NO_PROXY=postgres,dashboard,localhost,127.0.0.1
      - SIGNAL_BUY_THRESHOLD=${SIGNAL_BUY_THRESHOLD:-0.2}
      - SIGNAL_SELL_THRESHOLD=${SIGNAL_SELL_THRESHOLD:--0.2}
      - SIGNAL_NEUTRAL_THRESHOLD=${SIGNAL_NEUTRAL_THRESHOLD:-0.05}
      - MODEL_DISABLE_MIN_SAMPLES=${MODEL_DISABLE_MIN_SAMPLES:-10}
      - MODEL_DISABLE_HIT_RATE=${MODEL_DISABLE_HIT_RATE:-40}
      - USE_PARTIAL_CANDLE=${USE_PARTIAL_CANDLE:-false}
      # Email digest
      - EMAIL_ENABLED=${EMAIL_ENABLED:-true}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-465}
      - EMAIL_SMTP_SSL=${EMAIL_SMTP_SSL:-true}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER:-}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Trading Signals}
      - EMAIL_DIGEST_HOUR=${EMAIL_DIGEST_HOUR:-8}
      - EMAIL_DIGEST_MINUTE=${EMAIL_DIGEST_MINUTE:-0}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]

  # ============================================================
  # Streamlit Dashboard
  # ============================================================
  dashboard:
    build: .
    container_name: arima_dashboard
    command: >
      streamlit run streamlit_app/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.baseUrlPath=/dashboard
      --server.headless true
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - TZ=${TZ:-Europe/Moscow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  # ============================================================
  # Nginx (reverse proxy + HTTPS)
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: arima_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
      - dashboard
    restart: unless-stopped
    networks: [internal]

  # ============================================================
  # Certbot — Let's Encrypt SSL (запускается из cron на хосте)
  # ============================================================
  certbot:
    image: certbot/certbot
    container_name: arima_certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
