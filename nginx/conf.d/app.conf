# =========================================================================
# Trading Signals — reverse proxy + HTTPS
# Домен: vm123123new.firstbyte.club
#
# Маршрутизация:
#   /            → FastAPI (порт 8002 контейнера app)
#   /dashboard/  → Streamlit (порт 8501 контейнера dashboard)
# =========================================================================

# Upstream-ы для проксирования
upstream arima_app {
    server app:8002;
}
upstream arima_dashboard {
    server dashboard:8501;
}

# ============================================================
# HTTP — только для Let's Encrypt + редирект на HTTPS
# ============================================================
server {
    listen 80;
    server_name vm123123new.firstbyte.club;

    # ACME challenge для certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS — основной сервер
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name vm123123new.firstbyte.club;

    ssl_certificate     /etc/letsencrypt/live/vm123123new.firstbyte.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vm123123new.firstbyte.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Лимиты
    client_max_body_size 25M;
    proxy_read_timeout 120s;

    # ============================================================
    # Streamlit dashboard (под путём /dashboard/)
    # ============================================================
    location /dashboard/ {
        proxy_pass http://arima_dashboard/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket для Streamlit
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ============================================================
    # Всё остальное — FastAPI
    # ============================================================
    location / {
        proxy_pass http://arima_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
